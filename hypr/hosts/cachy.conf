# ############################################################################
# HOST: cachy — CachyOS (Arch), Intel Core i5-9400F (no iGPU, the F suffix),
# NVIDIA GeForce RTX 2060 6 GB (TU106/Turing) on the open kernel modules,
# 16 GB RAM. Single GPU: no PRIME, no render-offload.
# Symlink this file to ~/.config/hypr/host.conf on that machine.
# ############################################################################

# ######## Monitors ########
# `hyprctl monitors` for names. DP-1 (LG ULTRAWIDE) is the PRIMARY.
monitor = DP-1, 3440x1440@159.96, 0x0, 1
# DP-2 (AOC 25G4S) came up at 1920x1080@60 out of the box — that was just the
# fallback mode; the panel advertises 300/270/240/144/120 Hz. 300 is its best.
monitor = DP-2, 1920x1080@300, 3440x0, 1
# Fallback if 300 Hz is unstable over this DP cable (flicker / blank / mode reset):
#monitor = DP-2, 1920x1080@240, 3440x0, 1

# No $primary-style variable exists in this repo, so nothing to point at DP-1;
# workspaces follow the focused monitor. To pin them explicitly, uncomment:
#workspace = 1, monitor:DP-1, default:true
#workspace = 2, monitor:DP-1
#workspace = 9, monitor:DP-2, default:true

# ######## GPU env (NVIDIA RTX 2060, open modules, driver 610.57.04) ########
env = LIBVA_DRIVER_NAME, nvidia            # VA-API hardware video decode via nvidia-vaapi-driver
env = NVD_BACKEND, direct                  # nvidia-vaapi-driver talks to the driver directly (no X/GLX path)
env = __GLX_VENDOR_LIBRARY_NAME, nvidia    # GLVND picks the NVIDIA GLX vendor for XWayland clients
env = GBM_BACKEND, nvidia-drm              # allocate buffers through nvidia-drm's GBM
# ^ GBM_BACKEND is the first line to comment out if Electron apps or Firefox come
#   up black / blank: some builds pick the wrong GBM device and never recover.
env = ELECTRON_OZONE_PLATFORM_HINT, auto   # Electron picks Wayland (Arch counterpart of NIXOS_OZONE_WL)
# MOZ_ENABLE_WAYLAND is portable and stays in hyprland/env.conf.
# Deliberately NOT set here:
#   WLR_NO_HARDWARE_CURSORS — wlroots-only, Hyprland has cursor:no_hardware_cursors below.
# env = __GL_GSYNC_ALLOWED, 0   # only matters once a VRR-capable link exists
# env = __GL_VRR_ALLOWED, 0     # ditto — leave both unset while vrr is a no-op
# env = __GL_SHADER_DISK_CACHE_SIZE, 8589934592   # 8 GiB shader cache, mirrors the AMD host

# ######## Cursor ########
cursor {
    # HW cursors work on the open modules here. If the cursor turns invisible,
    # leaves trails, or flickers over fullscreen games, flip this to true:
    no_hardware_cursors = false
    #no_hardware_cursors = true   # <- classic NVIDIA fallback
}

# ######## Rendering / performance ########
# 6 GB RTX 2060 driving 3440x1440@160: blur is the single most expensive effect at
# this resolution, so cut the shared 8/3 down to 4/2 and shrink the shadow range.
# Costs a little softness, buys back several ms per frame on the ultrawide.
decoration {
    blur {
        size = 4
        passes = 2
        new_optimizations = true
        xray = true
    }
    shadow {
        range = 16
    }
}

render {
    direct_scanout = 2   # fullscreen games only — reaffirmed for this host
}

misc {
    # NVIDIA, not the broken AMD card: VRR is safe to arm. 2 = fullscreen only.
    # No-op today — both DP-1 and DP-2 report vrr=false in `hyprctl monitors -j`,
    # so this only takes effect once a VRR-capable link/panel is attached.
    vrr = 2
    # vfr is always on in 0.55+ (moved to debug:vfr) — left commented so the
    # config does not error out on 0.56:
    #vfr = true
}
