# personal overrides, sourced last
# Extra or replacement keybinds. Examples:
#
# unbind = Super, T
# bind = Super, T, exec, kitty
# bind = Super+Shift, W, exec, firefox --private-window

# ######## Reaching the game workspace ########
# gaming.conf sends every game to a workspace called "game", but nothing could
# switch to it: Super+1..0 only reach numbered workspaces and the e+1/e-1
# navigation skips named ones. A game could therefore vanish with no way back -
# it was not gone, just parked somewhere unreachable.
#
# Super+F1 jumps to it and back (back_and_forth), Super+Shift+F1 sends the
# focused window there.
bind = Super, F1, workspace, name:game
bind = Super+Shift, F1, movetoworkspace, name:game
