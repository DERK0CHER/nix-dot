# Idle management. Game mode (hypr/scripts/game-mode) suppresses lock/dpms/suspend:
# `game-mode status -q` exits 0 while game mode is on.
$gm = ~/.config/hypr/scripts/game-mode status -q
$lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = pidof steam || systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 180 # 3 min
    on-timeout = $gm || loginctl lock-session
}

listener {
    timeout = 240 # 4 min
    on-timeout = $gm || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 540 # 9 min
    on-timeout = $gm || $suspend_cmd
}
