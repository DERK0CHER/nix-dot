# ######## Window rules — Hyprland 0.55 syntax ########
# windowrule = EFFECT VALUE[, EFFECT VALUE...], match:PROP REGEX[, match:PROP REGEX]

# Tiling
windowrule = tile on, match:class ^dev\.warp\.Warp$

# Picture-in-Picture
windowrule = float on, pin on, keep_aspect_ratio on, move 73% 72%, size 25% 25%, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# Dialogs
windowrule = float on, center on, match:title ^(Open File)(.*)$
windowrule = float on, center on, match:title ^(Select a File)(.*)$
windowrule = float on, center on, match:title ^(Choose wallpaper)(.*)$
windowrule = float on, center on, match:title ^(Open Folder)(.*)$
windowrule = float on, center on, match:title ^(Save As)(.*)$
windowrule = float on, center on, match:title ^(Library)(.*)$
windowrule = float on, center on, match:title ^(File Upload)(.*)$
windowrule = float on, center on, match:title ^(Preferences|Settings|Properties)$
windowrule = float on, center on, match:class ^(pavucontrol|nm-connection-editor|blueman-manager|org\.gnome\.Settings)$
windowrule = float on, center on, size 60% 70%, match:class ^(easyeffects|com\.github\.wwmm\.easyeffects)$
windowrule = float on, center on, match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-gnome)$

# Games / wine / gamescope: tear, no effects, no animations
windowrule = immediate on, no_blur on, no_shadow on, no_anim on, idle_inhibit fullscreen, match:class ^(steam_app_)
windowrule = immediate on, no_blur on, no_shadow on, no_anim on, idle_inhibit fullscreen, match:class ^(gamescope)
windowrule = immediate on, no_blur on, no_shadow on, no_anim on, idle_inhibit fullscreen, match:title .*\.exe$
windowrule = immediate on, no_blur on, no_shadow on, no_anim on, match:class ^(.*\.exe|wine|explorer\.exe)$
windowrule = idle_inhibit fullscreen, match:class ^(firefox|mpv|vlc)$

# Steam
windowrule = float on, match:class ^(steam)$, match:title ^(Friends List|Steam Settings|Screenshot Manager)$
windowrule = no_anim on, no_blur on, match:class ^(steam)$, match:title ^(notificationtoasts.*)$

# No shadow on tiled windows
windowrule = no_shadow on, match:float off

# Kitty: clear (non-frosted) transparency — disable window blur
windowrule = no_blur on, match:class ^(kitty)$

# Solo tiled window / single fullscreen window: drop rounding (smart gaps)
windowrule = rounding 0, match:workspace w[tv1], match:float off
windowrule = rounding 0, match:workspace f[1], match:float off

# ######## Workspace rules ########
workspace = special:special, gapsout:30
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

# ######## Layer rules ########
# layerrule = EFFECT VALUE[, ...], match:namespace REGEX

# hyprshell (Quickshell)
layerrule = blur on, ignore_alpha 0.3, xray on, animation slide top, match:namespace ^hyprshell-bar$
layerrule = blur on, ignore_alpha 0.4, match:namespace ^hyprshell-panel$
layerrule = blur on, ignore_alpha 0.3, match:namespace ^hyprshell-notif$
layerrule = blur on, ignore_alpha 0.3, animation fade, match:namespace ^hyprshell-osd$

# wofi
layerrule = blur on, ignore_alpha 0.3, animation popin 90%, match:namespace ^wofi$

# misc
layerrule = animation off, match:namespace ^selection$
layerrule = animation off, match:namespace ^hyprpicker$
layerrule = blur on, match:namespace ^logout_dialog$
layerrule = blur on, ignore_alpha 0.0, match:namespace ^gtk-layer-shell$
