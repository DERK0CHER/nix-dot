$shell = qs -c hyprshell ipc call shell
$gamemode = ~/.config/hypr/scripts/game-mode

# ######## Shell (hyprshell) ########
bind = Super, I, exec, $shell toggleQuickSettings
bind = Super, N, exec, $shell toggleNotifications
bind = Super, A, exec, $shell toggleAppMenu
bind = Super, B, exec, $shell toggleBar
bind = Super+Shift, D, exec, $shell toggleNotifications
bind = Super, Space, exec, pkill -x wofi || wofi --show drun
# Command palette: every active Hyprland binding, searchable, read live from
# `hyprctl binds -j` so it cannot drift out of sync with this file.
bind = Super+Shift, Space, exec, qs -c hyprshell ipc call shell togglePalette
bind = Super, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# ######## Game mode ########
bind = Super, G, exec, $gamemode toggle
bind = Super+Shift, G, exec, $gamemode run --exclusive -- steam

# ######## Audio ########
bindl = Alt, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bindl = Super, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = Super+Shift, M, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0%
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# ######## Brightness ########
bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ######## Screenshots (hyprshot) ########
bind = Shift+Alt, 2, exec, hyprshot -m window --clipboard-only --silent
bind = Shift+Alt, 3, exec, hyprshot -m region --clipboard-only --silent
bind = Shift+Alt, 4, exec, hyprshot -m region --silent -o ~/Pictures/Screenshots
bind = Super+Shift, C, exec, hyprpicker -a

# ######## Screen recording ########
bind = Super+Alt, R, exec, pkill -INT wf-recorder || (mkdir -p ~/Videos/Recordings && wf-recorder -g "$(slurp)" -f ~/Videos/Recordings/$(date '+%Y-%m-%d_%H.%M.%S').mp4)
bind = Ctrl+Alt, R, exec, pkill -INT wf-recorder || (mkdir -p ~/Videos/Recordings && wf-recorder -f ~/Videos/Recordings/$(date '+%Y-%m-%d_%H.%M.%S').mp4)
bind = Super+Alt, O, exec, obs

# ######## Session ########
bind = Super, L, exec, loginctl lock-session
bind = Ctrl+Shift+Alt, Delete, exec, pkill wlogout || wlogout -p layer-shell
bind = Ctrl+Shift+Alt+Super, Delete, exec, systemctl poweroff || loginctl poweroff
bindr = Ctrl+Super, R, exec, hyprctl reload; pkill -x qs; pkill -x quickshell; qs -c hyprshell &

# ######## Windows ########
bind = Super, Left, movefocus, l
bind = Super, Right, movefocus, r
bind = Super, Up, movefocus, u
bind = Super, Down, movefocus, d
bind = Super, BracketLeft, movefocus, l
bind = Super, BracketRight, movefocus, r
bindm = Super, mouse:272, movewindow
bindm = Super, mouse:273, resizewindow
bind = Super, Q, killactive
bind = Super+Shift+Alt, Q, exec, hyprctl kill

bind = Super+Shift, Left, movewindow, l
bind = Super+Shift, Right, movewindow, r
bind = Super+Shift, Up, movewindow, u
bind = Super+Shift, Down, movewindow, d
bind = Super+Shift, H, movewindow, l
bind = Super+Shift, L, movewindow, r
bind = Super+Shift, K, movewindow, u
bind = Super+Shift, J, movewindow, d

binde = Super, Minus, layoutmsg, splitratio -0.1
binde = Super, Equal, layoutmsg, splitratio +0.1
binde = Super, Semicolon, layoutmsg, splitratio -0.1
binde = Super, Apostrophe, layoutmsg, splitratio +0.1

bind = Super+Alt, Space, togglefloating
bind = Super+Alt, F, fullscreenstate, 0 3
bind = Super, F, fullscreen, 0
bind = Super, D, fullscreen, 1
bind = Ctrl+Super, Backslash, resizeactive, exact 640 480
bind = Super, P, pin
bind = Super+Alt, G, togglegroup
bind = Super+Alt, Tab, changegroupactive, f

# ######## Workspaces ########
bind = Super, 1, workspace, 1
bind = Super, 2, workspace, 2
bind = Super, 3, workspace, 3
bind = Super, 4, workspace, 4
bind = Super, 5, workspace, 5
bind = Super, 6, workspace, 6
bind = Super, 7, workspace, 7
bind = Super, 8, workspace, 8
bind = Super, 9, workspace, 9
bind = Super, 0, workspace, 10

bind = Super+Shift, 1, movetoworkspace, 1
bind = Super+Shift, 2, movetoworkspace, 2
bind = Super+Shift, 3, movetoworkspace, 3
bind = Super+Shift, 4, movetoworkspace, 4
bind = Super+Shift, 5, movetoworkspace, 5
bind = Super+Shift, 6, movetoworkspace, 6
bind = Super+Shift, 7, movetoworkspace, 7
bind = Super+Shift, 8, movetoworkspace, 8
bind = Super+Shift, 9, movetoworkspace, 9
bind = Super+Shift, 0, movetoworkspace, 10

bind = Super+Alt, 1, movetoworkspacesilent, 1
bind = Super+Alt, 2, movetoworkspacesilent, 2
bind = Super+Alt, 3, movetoworkspacesilent, 3
bind = Super+Alt, 4, movetoworkspacesilent, 4
bind = Super+Alt, 5, movetoworkspacesilent, 5
bind = Super+Alt, 6, movetoworkspacesilent, 6
bind = Super+Alt, 7, movetoworkspacesilent, 7
bind = Super+Alt, 8, movetoworkspacesilent, 8
bind = Super+Alt, 9, movetoworkspacesilent, 9
bind = Super+Alt, 0, movetoworkspacesilent, 10

bind = Super, mouse_up, workspace, +1
bind = Super, mouse_down, workspace, -1
bind = Ctrl+Super, Right, workspace, r+1
bind = Ctrl+Super, Left, workspace, r-1
bind = Ctrl+Super+Alt, Right, workspace, m+1
bind = Ctrl+Super+Alt, Left, workspace, m-1
bind = Super, Page_Down, workspace, +1
bind = Super, Page_Up, workspace, -1
bind = Ctrl+Super, Page_Down, workspace, r+1
bind = Ctrl+Super, Page_Up, workspace, r-1
bind = Ctrl+Super, BracketLeft, workspace, -1
bind = Ctrl+Super, BracketRight, workspace, +1
bind = Ctrl+Super, Up, workspace, r-5
bind = Ctrl+Super, Down, workspace, r+5
bind = Super, Tab, workspace, previous

bind = Super+Shift, mouse_down, movetoworkspace, r-1
bind = Super+Shift, mouse_up, movetoworkspace, r+1
bind = Super+Alt, mouse_down, movetoworkspace, -1
bind = Super+Alt, mouse_up, movetoworkspace, +1
bind = Ctrl+Super+Shift, Right, movetoworkspace, r+1
bind = Ctrl+Super+Shift, Left, movetoworkspace, r-1

# Special workspace
bind = Super, S, togglespecialworkspace
bind = Super, mouse:275, togglespecialworkspace
bind = Super+Alt, S, movetoworkspacesilent, special
bind = Ctrl+Super+Shift, Up, movetoworkspacesilent, special
bind = Ctrl+Super, S, togglespecialworkspace

# ######## Alt+Tab switcher ########
# cyclenext switched focus on every press, so tapping Alt+Tab twice landed two
# windows away instead of back where you started. This opens the hyprshell
# overlay instead and only commits the focus change when Alt is released.
#
# Deliberately NOT a submap, although a submap is the obvious way to scope these
# keys: measured on Hyprland 0.56.2, a release bind only fires if the key was
# pressed while the *same* submap was already active. Alt is pressed in the
# default submap, so `bind = Alt, Tab, submap, switcher` makes the Alt release
# undetectable and the overlay never closes. Global binds have no such problem
# and cannot leave the session stuck in a submap either.
#
# Cancel is Alt+Escape rather than plain Escape: Alt is held by definition while
# the overlay is up, so Escape stays free for everything else.
bind = Alt, Tab, exec, qs -c hyprshell ipc call switcher next
bind = Alt+Shift, Tab, exec, qs -c hyprshell ipc call switcher prev
# code:9 is Escape. Measured on 0.56.2: `Alt, Escape` by keysym name never
# fires while Alt is held, the keycode always does.
bind = Alt, code:9, exec, qs -c hyprshell ipc call switcher cancel
# Alt+Q closes the highlighted window and keeps the overlay up, so several can
# be closed without letting go of Alt. Bound globally like the rest, and the
# handler is a no-op when the switcher is closed - otherwise this would be a
# silent window-killer on a very reachable key.
bind = Alt, Q, exec, qs -c hyprshell ipc call switcher close

# Alt+1..0 sends the highlighted window to that workspace and keeps the overlay
# up, so you can relocate several without letting go of Alt. No-op when the
# switcher is closed.
bind = Alt, 1, exec, qs -c hyprshell ipc call switcher moveTo 1
bind = Alt, 2, exec, qs -c hyprshell ipc call switcher moveTo 2
bind = Alt, 3, exec, qs -c hyprshell ipc call switcher moveTo 3
bind = Alt, 4, exec, qs -c hyprshell ipc call switcher moveTo 4
bind = Alt, 5, exec, qs -c hyprshell ipc call switcher moveTo 5
bind = Alt, 6, exec, qs -c hyprshell ipc call switcher moveTo 6
bind = Alt, 7, exec, qs -c hyprshell ipc call switcher moveTo 7
bind = Alt, 8, exec, qs -c hyprshell ipc call switcher moveTo 8
bind = Alt, 9, exec, qs -c hyprshell ipc call switcher moveTo 9
bind = Alt, 0, exec, qs -c hyprshell ipc call switcher moveTo 10

# Both Alt keys, and with Shift still down, so releasing Alt out of a
# Alt+Shift+Tab always commits. commit is a no-op when the overlay is closed.
bindrt = Alt, Alt_L, exec, qs -c hyprshell ipc call switcher commit
bindrt = Alt, Alt_R, exec, qs -c hyprshell ipc call switcher commit
bindrt = Alt+Shift, Alt_L, exec, qs -c hyprshell ipc call switcher commit
bindrt = Alt+Shift, Alt_R, exec, qs -c hyprshell ipc call switcher commit

# ######## Media ########
bindl = Super+Shift, N, exec, playerctl next
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = Super+Shift, B, exec, playerctl previous
bindl = Super+Shift, P, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindel = Super+Shift, Comma, exec, playerctl volume 0.03-
bindel = Super+Shift, Period, exec, playerctl volume 0.03+
bind = Super+Shift+Alt, mouse:275, exec, playerctl previous
bind = Super+Shift+Alt, mouse:276, exec, playerctl next

# ######## Apps ########
# Secondary terminal. foot exists on the nix host but not on cachy, so fall
# back rather than leaving a shortcut that silently does nothing.
bind = Super, T, exec, command -v foot >/dev/null && foot || kitty
bind = Super, Return, exec, kitty
bind = Super, Z, exec, zed
bind = Super, C, exec, code
bind = Super, E, exec, nautilus --new-window
bind = Super+Alt, E, exec, thunar
bind = Super, W, exec, firefox
bind = Ctrl+Super, W, exec, firefox
bind = Ctrl+Super, I, exec, XDG_CURRENT_DESKTOP=gnome gnome-control-center
bind = Ctrl+Super, V, exec, pavucontrol
bind = Ctrl+Super+Shift, V, exec, easyeffects
bind = Ctrl+Shift, Escape, exec, gnome-system-monitor

# ######## Remote access ########
# wayvnc on loopback only — reach it via SSH tunnel:  ssh -L 5900:127.0.0.1:5900 <host>
bind = Super+Shift, V, exec, pkill wayvnc && notify-send "wayvnc stopped" || (notify-send "wayvnc listening on 127.0.0.1:5900"; wayvnc 127.0.0.1 5900)

# ######## Shortcut capture submap ########
# While the palette records a new shortcut it needs the raw keys - otherwise
# pressing Super+G fires game mode instead of being captured. Hyprland consumes
# its own binds before the focused surface ever sees them, and an exclusive
# keyboard grab on a layer surface does not change that. Switching into a submap
# with (almost) nothing bound lets every combination fall through to the palette.
#
# Escape stays bound as the way out, so a crashed shell can never leave the
# session in a submap with no keybindings at all.
submap = hyprshell-capture
bind = , escape, submap, reset
submap = reset

