# Shared environment — PORTABLE variables only.
# Anything tied to a GPU vendor (Mesa/RADV, NVIDIA, VA-API backends) lives in
# hypr/hosts/<host>.conf, sourced later via ~/.config/hypr/host.conf.

# ######## Input method (fcitx5) ########
# https://fcitx-im.org/wiki/Using_Fcitx_5_on_Wayland
env = QT_IM_MODULE, fcitx
env = XMODIFIERS, @im=fcitx
env = SDL_IM_MODULE, fcitx
env = GLFW_IM_MODULE, ibus
env = INPUT_METHOD, fcitx
# env = GTK_IM_MODULE, fcitx   # not needed on Wayland; crashes some xwayland electron apps

# ######## Toolkits / Wayland ########
env = QT_QPA_PLATFORM, wayland
# Qt apps export their menu bar only under the KDE platform theme - qt6ct does
# not do it. This is what makes the global menu work for every Qt program
# rather than just the one you launched by hand. The cost is that Qt apps now
# follow KDE (Breeze) theming instead of qt6ct's adwaita-dark; still dark and
# consistent, but not Adwaita. Set this back to qt6ct to trade the menus away.
env = QT_QPA_PLATFORMTHEME, kde

# GTK3 apps export through appmenu-gtk-module. Harmless when the module is
# absent or the app is GTK4. UNTESTED: no GTK3 application is installed here.
# GTK4/libadwaita apps (nautilus, gnome-text-editor, pavucontrol) have no menu
# bar at all - only hamburger popovers - so nothing can be exported for them.
env = GTK_MODULES, appmenu-gtk-module
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = NIXOS_OZONE_WL, 1   # NixOS-only Electron hint; ignored elsewhere (Arch uses ELECTRON_OZONE_PLATFORM_HINT, set per host)
env = MOZ_ENABLE_WAYLAND, 1
env = SDL_VIDEODRIVER, wayland,x11
env = CLUTTER_BACKEND, wayland
env = XDG_STATE_HOME, $HOME/.local/state
# GTK theme is NOT set here: adw-gtk3-dark comes via gsettings (execs.conf).
# Monitors are scale 1 -> no GDK_SCALE.

# ######## Cursor ########
env = XCURSOR_THEME, Adwaita
env = XCURSOR_SIZE, 24
# HYPRCURSOR_THEME needs a hyprcursor-format theme (Adwaita from nixpkgs is xcursor-only).
# Leave unset -> Hyprland falls back to XCURSOR_*. Enable only if you install one:
# env = HYPRCURSOR_THEME, Adwaita
# env = HYPRCURSOR_SIZE, 24

# ######## XWayland ########
xwayland {
    force_zero_scaling = true
}
