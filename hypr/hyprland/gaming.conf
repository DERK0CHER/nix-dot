# ######## Gaming — Hyprland 0.55 rule syntax ########
# Sourced from hyprland.conf. Game windows land on a bare "game" workspace
# with every effect off; hypr/scripts/game-mode takes care of the rest
# (compositor keywords, focus lock, priority, shell/bar, background services).
#
# HOST-PORTABLE FILE — keep it vendor- and monitor-neutral.
# Nothing here names a monitor: the "game" workspace is not bound to an output,
# so it opens on whichever monitor is focused, which in practice is the primary
# one (cachy: DP-1, the 3440x1440 LG ultrawide; nix: HDMI-A-1). If you want a
# hard binding, put a `workspace = name:game, monitor:<name>` line in
# hypr/hosts/<host>.conf — that file is sourced after this one and wins.
#
# Vendor workarounds live in hypr/hosts/ too, NOT here:
#   nix (AMD RDNA4): AQ_NO_ATOMIC=1 and misc:vrr = 0 — atomic DRM + VRR crashed
#   that card. Those must never apply to the NVIDIA host.
# The rules below (immediate/tearing, no effects, idle inhibit, content game)
# are driver-neutral and correct on both amdgpu/RADV and nvidia-open.

# Bare workspace for games: no gaps, no borders, no rounding, no decorations.
workspace = name:game, gapsin:0, gapsout:0, bordersize:0, rounding:false, decorate:false, persistent:false

# Game windows: Steam games, gamescope, Wine/Proton .exe, Lutris, Heroic.
windowrule = workspace name:game, match:class ^(steam_app_\d+|gamescope|.*\.exe|lutris-.*|heroic.*)$
windowrule = fullscreen on, match:class ^(steam_app_\d+|gamescope|.*\.exe|lutris-.*|heroic.*)$
windowrule = immediate on, match:class ^(steam_app_\d+|gamescope|.*\.exe|lutris-.*|heroic.*)$
windowrule = no_blur on, no_shadow on, no_anim on, match:class ^(steam_app_\d+|gamescope|.*\.exe|lutris-.*|heroic.*)$
windowrule = opacity 1 override, match:class ^(steam_app_\d+|gamescope|.*\.exe|lutris-.*|heroic.*)$
windowrule = idle_inhibit fullscreen, match:class ^(steam_app_\d+|gamescope|.*\.exe|lutris-.*|heroic.*)$

# Anything that tags itself as a game via xdg-toplevel-tag gets game content
# handling (tearing / direct scanout allowed, no effects).
windowrule = content game, match:xdg_tag .*game.*
windowrule = immediate on, match:xdg_tag .*game.*

# Steam client: small utility windows float, Big Picture goes fullscreen.
windowrule = float on, match:class ^(steam)$, match:title ^(Friends List|Steam Settings)$
windowrule = float on, match:class ^(steam)$, match:title ^(Steam - News|Steam - Self Updater)(.*)$
windowrule = fullscreen on, workspace name:game, match:class ^(steam)$, match:title ^(Steam Big Picture Mode)(.*)$
windowrule = no_blur on, no_shadow on, match:class ^(steam)$

# Launchers (Lutris / Heroic / Bottles main windows are not games themselves).
windowrule = no_blur on, match:class ^(net\.lutris\.Lutris|com\.heroicgameslauncher\.hgl|com\.usebottles\.bottles)$

# Tearing: allow_tearing is a global (set by game-mode's runtime keywords and,
# per host, in hypr/hosts/<host>.conf). `immediate on` above is the per-window
# half of it and is safe on every driver — Hyprland only tears when the window
# is fullscreen, unoccluded and actually asks for it.

# Wine/Proton helper windows (system tray, runtime notices) float instead of
# tiling into the game's workspace. Vendor-neutral.
windowrule = float on, center on, match:class ^(.*\.exe)$, match:title ^(Wine System Tray|Steam Linux Runtime.*)$
