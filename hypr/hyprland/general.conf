# ######## Monitors ########
# `hyprctl monitors` for names
monitor = HDMI-A-1, 2560x1440@143.99, 0x0, 1
monitor = DP-1, 1920x1080@300, 2560x0, 1, transform, 0

# LG 32GP850 (Nano IPS, DisplayHDR 400) alternatives — pick ONE by (un)commenting.
# DISABLED 2026-06-15 — atomic DRM commits fail on AMD Navi 44 + Hyprland 0.54.3
# (eglDupNativeFenceFDANDROID EGL_BAD_PARAMETER, render queue stalls, SIGABRT).
# AQ_NO_ATOMIC=1 is set in nixos/modules/hyprland.nix — keep it.
#monitor = HDMI-A-1, 2560x1440@120, 0x0, 1, bitdepth, 10, cm, hdredid, sdrbrightness, 1.2, sdrsaturation, 0.85
#monitor = HDMI-A-1, 2560x1440@143.99, 0x0, 1, bitdepth, 10, cm, hdredid, sdrbrightness, 1.2, sdrsaturation, 0.85
#monitor = HDMI-A-1, 2560x1440@143.99, 0x0, 1, bitdepth, 10, cm, wide

# ######## Input ########
input {
    kb_layout = us
    kb_options = caps:swapescape
    numlock_by_default = false
    repeat_delay = 250
    repeat_rate = 35
    follow_mouse = 1
    special_fallthrough = true
    accel_profile = flat

    touchpad {
        tap-to-click = false
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

gestures {
    workspace_swipe_distance = 700
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
}
gesture = 3, horizontal, workspace

binds {
    scroll_event_delay = 0
    workspace_back_and_forth = true
    allow_workspace_cycles = true
    movefocus_cycles_fullscreen = false
}

# ######## Layout ########
general {
    gaps_in = 4
    gaps_out = 8
    gaps_workspaces = 50
    border_size = 0
    resize_on_border = true
    no_focus_fallback = true
    layout = dwindle
    allow_tearing = true   # enables the `immediate` window rule

    snap {
        enabled = true
        window_gap = 10
        monitor_gap = 10
    }
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = false
    # pseudotile = true   # option gone in 0.55+, `pseudo` dispatcher still works
}

# ######## Look ########
decoration {
    rounding = 12
    rounding_power = 2

    blur {
        enabled = true
        size = 8
        passes = 3
        xray = true
        new_optimizations = true
        ignore_opacity = true
        popups = true
        popups_ignorealpha = 0.6
        special = false
        noise = 0.01
    }

    shadow {
        enabled = true
        range = 24
        offset = 0 4
        render_power = 3
        color = rgba(00000040)
        color_inactive = rgba(00000030)
    }

    dim_inactive = false
    dim_special = 0
}

# GNOME-like: short, decelerating, no overshoot
animations {
    enabled = true

    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07

    animation = windows, 1, 3, md3_decel, popin 80%
    animation = windowsIn, 1, 3, md3_decel, popin 80%
    animation = windowsOut, 1, 2, md3_accel, popin 80%
    animation = windowsMove, 1, 3, md3_standard
    animation = border, 1, 10, default
    animation = fade, 1, 3, md3_decel
    animation = layersIn, 1, 2, menu_decel, slide
    animation = layersOut, 1, 1.5, menu_accel, slide
    animation = fadeLayersIn, 1, 2, menu_decel
    animation = fadeLayersOut, 1, 1, menu_accel
    animation = workspaces, 1, 5, md3_standard, slide
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}

# ######## Groups (Adwaita-like, subtle) ########
group {
    col.border_active = rgba(3584e4aa)
    col.border_inactive = rgba(ffffff1a)
    col.border_locked_active = rgba(e01b24aa)
    col.border_locked_inactive = rgba(ffffff1a)
    drag_into_group = 2

    groupbar {
        enabled = true
        font_family = Adwaita Sans
        font_size = 12
        height = 18
        gradients = false
        render_titles = true
        rounding = 8
        indicator_height = 2
        gaps_in = 4
        gaps_out = 4
        col.active = rgba(3584e4cc)
        col.inactive = rgba(30303099)
        col.locked_active = rgba(e01b24cc)
        col.locked_inactive = rgba(30303099)
        text_color = rgba(ffffffee)
    }
}

# ######## Cursor ########
cursor {
    no_hardware_cursors = false   # AMD handles HW cursors fine
    inactive_timeout = 5
    sync_gsettings_theme = true
}

# ######## Rendering / performance (AMD RDNA4, RADV) ########
render {
    direct_scanout = 2   # fullscreen games only
}

misc {
    # VRR disabled 2026-06-15 — both monitors report "crtc is incapable of vrr"
    # in aquamarine logs, and enabling it caused atomic DRM commit failures on
    # AMD Navi 44 (RX 9060 XT) leading to SIGABRT in CHyprRenderer::renderMonitor.
    vrr = 0
    # vfr is always on in 0.55+ (moved to debug:vfr)
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    on_focus_under_fullscreen = 2   # was new_window_takes_over_fullscreen
    initial_workspace_tracking = 0
    focus_on_activate = false
    middle_click_paste = false
    enable_swallow = true
    swallow_regex = ^(foot|kitty|Alacritty|alacritty)$
    allow_session_lock_restore = true
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
    font_family = Adwaita Sans
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

debug {
    disable_logs = true
}
