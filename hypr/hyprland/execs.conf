# ######## Wallpaper ########
# hyprpaper 0.8+ is IPC-only (no config file)
exec-once = hyprpaper
exec-once = sleep 1 && hyprctl hyprpaper wallpaper "DP-1,~/.config/hypr/wallpaper.jpeg" && hyprctl hyprpaper wallpaper "HDMI-A-1,~/.config/hypr/wallpaper.jpeg"

# ######## Shell (bar, quick settings, notifications, OSD) ########
exec-once = qs -c hyprshell

# ######## Session ########
exec-once = dbus-update-activation-environment --systemd --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1 || /run/current-system/sw/libexec/polkit-gnome-authentication-agent-1 || systemctl --user start hyprpolkitagent
exec-once = hypridle

# ######## Input method ########
exec-once = fcitx5

# ######## Audio ########
exec-once = easyeffects --gapplication-service

# ######## Clipboard history ########
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ######## Night light ########
# location: ~/.config/gammastep/config.ini (or geoclue)
exec-once = gammastep

# ######## GNOME / libadwaita look (adw-gtk3 + Adwaita) ########
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Adwaita'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = if fc-list | grep -qi 'Adwaita Sans'; then f='Adwaita Sans'; else f='Cantarell'; fi; gsettings set org.gnome.desktop.interface font-name "$f 11"; gsettings set org.gnome.desktop.interface document-font-name "$f 11"
exec-once = if fc-list | grep -qi 'Adwaita Mono'; then f='Adwaita Mono'; else f='Fira Mono'; fi; gsettings set org.gnome.desktop.interface monospace-font-name "$f 11"
exec-once = gsettings set org.gnome.desktop.wm.preferences button-layout ':'

# ######## Directories ########
exec-once = mkdir -p ~/Videos/Recordings ~/Pictures/Screenshots
