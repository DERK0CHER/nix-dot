$text_color = rgba(FFFFFFEE)
$text_dim = rgba(FFFFFF99)
$entry_background_color = rgba(FFFFFF14)
$entry_border_color = rgba(FFFFFF33)
$entry_color = rgba(FFFFFFEE)
$accent = rgba(3584E4FF)
$font_family = Adwaita Sans
$font_family_clock = Adwaita Sans Light

background {
    monitor =
    path = screenshot
    color = rgba(1E1E1EFF)
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 1
    rounding = 12
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    check_color = $accent
    fail_color = rgba(E01B24FF)
    font_family = $font_family
    placeholder_text = <i>Password</i>
    fade_on_empty = true

    position = 0, 20
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    font_size = 65
    font_family = $font_family_clock

    position = 0, 300
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $text_dim
    font_size = 17
    font_family = $font_family

    position = 0, 240
    halign = center
    valign = center
}

label { # User
    monitor =
    text =     $USER
    color = $text_color
    shadow_passes = 1
    shadow_boost = 0.35
    font_size = 20
    font_family = $font_family
    position = 0, 50
    halign = center
    valign = bottom
}

label { # Status
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $text_dim
    font_size = 14
    font_family = $font_family

    position = 30, -30
    halign = left
    valign = top
}
