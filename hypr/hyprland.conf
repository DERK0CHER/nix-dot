# Hyprland entry point — everything lives in ~/.config/hypr/hyprland/
# Order matters: env first, personal overrides (custom/*.conf) last.

source = ~/.config/hypr/hyprland/env.conf
source = ~/.config/hypr/hyprland/execs.conf
source = ~/.config/hypr/hyprland/general.conf
source = ~/.config/hypr/hyprland/colors.conf
source = ~/.config/hypr/hyprland/rules.conf
source = ~/.config/hypr/hyprland/gaming.conf
source = ~/.config/hypr/hyprland/keybinds.conf

# Per-machine settings (monitors, GPU env, GPU workarounds).
# host.conf is a SYMLINK into ~/.config/hypr/hosts/ (cachy.conf | nix.conf)
# created by the install script — never edit host.conf itself, edit hosts/<host>.conf.
source = ~/.config/hypr/host.conf

# Personal overrides, sourced last (glob). Anything here wins.
source = ~/.config/hypr/custom/*.conf
